version: '3.9'

services:
  # ── Banco de Dados PostgreSQL ──────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: radiacao_luz_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: radiacao_luz
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/ddl.sql:/docker-entrypoint-initdb.d/01-ddl.sql
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache Redis ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: radiacao_luz_cache
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Backend API (NestJS) ───────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: radiacao_luz_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASS: postgres
      DB_NAME: radiacao_luz
      DB_SSL: 'false'
      JWT_SECRET: ${JWT_SECRET:-change_me_in_production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FRONTEND_URL: http://localhost:3000
    ports:
      - '3001:3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  # ── Frontend Web (React + Vite) ────────────────────────────────────────
  frontend:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
    container_name: radiacao_luz_web
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:3001/api/v1
    ports:
      - '3000:80'
    depends_on:
      - backend

  # ── Monitoramento Grafana ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: radiacao_luz_grafana
    restart: unless-stopped
    ports:
      - '3030:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana

  # ── Métricas Prometheus ────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: radiacao_luz_prometheus
    restart: unless-stopped
    ports:
      - '9090:9090'
    volumes:
      - ./docs/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

volumes:
  postgres_data:
  grafana_data:
  prometheus_data:
